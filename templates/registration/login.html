{% extends "base.html" %}
{% block title %}ورود{% endblock %}
{% block content %}
<h1>ورود</h1>
<form method="post" novalidate>
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button type="submit">ورود</button>
</form>
<p><a href="{% url 'accounts:signup' %}">ثبت‌نام</a></p>
{% endblock %}
